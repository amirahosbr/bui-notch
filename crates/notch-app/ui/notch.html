<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>notch</title>
    <style>
      /* The panel is flush with the top of the screen and merges with the
         physical notch, so: pure black, square top corners, rounded bottom. */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Geometry, overwritten from AppKit's real measurements. */
        --menubar-h: 37px;
        --notch-w: 0px;
        --collapsed-w: 268px;

        /* easeOutQuint — fast off the mark, settles without overshooting (which
           would clip, since the window cannot grow past the panel's open size). */
        --unfurl: cubic-bezier(0.22, 1, 0.36, 1);
        --open-ms: 340ms;
        --close-ms: 300ms;

        /* Colour. The muted tones are kept at or above 4.5:1 on black so the
           small type still meets WCAG 2.2 AA. */
        --ink: #fff;
        --ink-muted: rgba(255, 255, 255, 0.72);
        --ink-faint: rgba(255, 255, 255, 0.58);
        --ok: #34d399;
        --warn: #fbbf24;
        --danger: #f87171;
        --surface: rgba(255, 255, 255, 0.06);
        --hairline: rgba(255, 255, 255, 0.14);

        /* Type. rem so the scale is set in one place. */
        --text-xs: 0.6rem;
        --text-sm: 0.66rem;
        --text-md: 0.72rem;
        --text-lg: 0.82rem;
        --text-clock: 1.45rem;

        --radius-sm: 0.375rem;
        --radius-md: 0.75rem;
        --gap: 0.5rem;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans CJK JP",
          sans-serif;
        color: var(--ink);
        user-select: none;
        cursor: default;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /* Screen-reader-only: the panel's heading, which must exist for the
         document to have a sane outline but must not take pixels in a 37pt strip. */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* --- the panel shape ---------------------------------------------- */

      /* The window never resizes — a window resize cannot be animated, and the
         webview relayouts on every step. Instead the window stays at the open
         size and this shape unfurls inside it, which composites on the GPU. */
      .panel {
        width: var(--collapsed-w);
        height: var(--menubar-h);
        background: #000;
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition:
          width var(--open-ms) var(--unfurl),
          height var(--open-ms) var(--unfurl),
          border-radius var(--close-ms) ease;
      }

      .panel--open {
        width: 100%;
        height: 100%;
        border-radius: 0 0 1.375rem 1.375rem;
      }

      /* --- the strip that lives in the menu-bar row, flanking the notch --- */

      .strip {
        height: var(--menubar-h);
        min-height: var(--menubar-h);
        cursor: pointer;
        display: flex;
        justify-content: center;
        flex-shrink: 0;
      }

      /* Pinned to the collapsed width so the glanceable numbers stay put as the
         panel widens around them, instead of sliding out to the new edges. */
      .strip__inner {
        width: var(--collapsed-w);
        display: flex;
        align-items: center;
      }

      .strip__slot {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.8rem;
        font-size: var(--text-md);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.1px;
      }

      .strip__slot--right {
        justify-content: flex-end;
      }

      /* The menu-bar row is one line tall — nothing in it may wrap. */
      .strip__slot > * {
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* Exactly the width of the physical notch — content never hides behind it. */
      .strip__gap {
        width: var(--notch-w);
        flex: 0 0 var(--notch-w);
      }

      .strip__clock {
        font-weight: 600;
      }

      .strip__meridiem {
        font-size: var(--text-xs);
        color: var(--ink-muted);
        margin-left: 0.15rem;
      }

      /* Pinned: the sliver reads as held rather than hovered. */
      .panel--pinned .strip__clock {
        color: var(--ok);
      }

      /* A 3-segment micro meter for the collapsed strip. */
      .micro {
        display: flex;
        gap: 2px;
        align-items: center;
      }

      .micro__seg {
        width: 4px;
        height: 9px;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.22);
      }

      .micro__seg--on {
        background: var(--ok);
      }

      /* --- the body, which only exists once the window has grown --------- */

      /* Fades up as the shape finishes growing, so the content arrives after the
         room exists for it rather than being squashed on the way out. */
      .body {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 0.15rem 0.75rem 0.75rem;
        gap: var(--gap);
        flex-direction: column;
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 200ms ease,
          transform 260ms var(--unfurl);
        pointer-events: none;
      }

      .panel--open .body {
        opacity: 1;
        transform: none;
        transition-delay: 130ms;
        pointer-events: auto;
      }

      /* --- tabs: rest on a pill to page through detail, no window needed --- */

      .tabs {
        display: flex;
        gap: 0.3rem;
        flex-shrink: 0;
      }

      .tab {
        font: inherit;
        font-size: var(--text-sm);
        font-weight: 600;
        letter-spacing: 0.2px;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        border: 0.5px solid transparent;
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink-muted);
        cursor: pointer;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      /* Set from the Rust cursor feed, since :hover cannot be trusted in a window
         that is never key. :focus-visible keeps it reachable by keyboard. */
      .tab--hot,
      .tab:focus-visible {
        background: rgba(255, 255, 255, 0.18);
        color: var(--ink);
        outline: none;
      }

      .tab--on {
        background: rgba(255, 255, 255, 0.92);
        color: #000;
      }

      .view {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        gap: var(--gap);
      }

      .view--on {
        display: flex;
      }

      /* --- cards --------------------------------------------------------- */

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
        gap: var(--gap);
        flex: 1;
        min-height: 0;
      }

      .card {
        background: var(--surface);
        border: 0.5px solid var(--hairline);
        border-radius: var(--radius-md);
        padding: 0.6rem 0.7rem;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* Staggered so the row assembles left-to-right instead of snapping in. */
      .card {
        opacity: 0;
        transform: translateY(6px) scale(0.985);
        transition:
          opacity 220ms ease,
          transform 300ms var(--unfurl);
      }

      .panel--open .card {
        opacity: 1;
        transform: none;
      }

      .panel--open .card:nth-child(1) {
        transition-delay: 150ms;
      }

      .panel--open .card:nth-child(2) {
        transition-delay: 190ms;
      }

      .card__title {
        font-size: var(--text-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--ink-faint);
        margin-bottom: 0.45rem;
      }

      .card__row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--gap);
      }

      .clock {
        font-size: var(--text-clock);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.6px;
        font-variant-numeric: tabular-nums;
      }

      .clock__meridiem {
        font-size: var(--text-md);
        font-weight: 600;
        color: var(--ink-muted);
        margin-left: 0.2rem;
        letter-spacing: 0.3px;
      }

      /* --- battery ------------------------------------------------------- */

      /* A drawn battery, so the number beside the clock cannot be misread as the
         day-progress percentage. */
      .batt {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        font-size: var(--text-md);
        color: var(--ink-muted);
      }

      /* Any `display` of our own outranks the UA's [hidden] rule, so every
         element the script hides has to say so itself. Without this the battery
         shows an empty shell before the first reading lands, and a card whose
         module is switched off stays on screen. */
      .batt[hidden],
      .card[hidden] {
        display: none;
      }

      .batt__shell {
        width: 18px;
        height: 9px;
        border: 1px solid var(--ink-muted);
        border-radius: 2.5px;
        padding: 1px;
        position: relative;
      }

      .batt__shell::after {
        content: "";
        position: absolute;
        inset-inline-end: -3px;
        inset-block-start: 2.5px;
        width: 1.5px;
        height: 3px;
        border-start-end-radius: 1px;
        border-end-end-radius: 1px;
        background: var(--ink-muted);
      }

      .batt__fill {
        display: block;
        height: 100%;
        width: var(--pct, 0%);
        border-radius: 1px;
        background: var(--ink-muted);
        transition:
          width 400ms ease,
          background 300ms ease;
      }

      .batt__fill--low {
        background: var(--danger);
      }

      .batt__fill--charging {
        background: var(--ok);
      }

      /* --- meters -------------------------------------------------------- */

      .meter {
        margin-top: 0.55rem;
      }

      .meter__top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: var(--text-md);
        margin-bottom: 0.25rem;
        gap: 0.4rem;
      }

      .meter__label {
        font-weight: 600;
      }

      .meter__value {
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meter__track {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      .meter__fill {
        height: 100%;
        width: var(--pct, 0%);
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.65);
        transition: width 400ms ease;
      }

      .meter__fill--warn {
        background: var(--warn);
      }

      .meter__fill--accent {
        background: var(--ok);
      }

      /* --- detail list --------------------------------------------------- */

      .facts {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .facts__row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--gap);
        padding: 0.3rem 0;
        font-size: var(--text-md);
        font-variant-numeric: tabular-nums;
      }

      .facts__row + .facts__row {
        border-top: 0.5px solid rgba(255, 255, 255, 0.09);
      }

      .facts__key {
        color: var(--ink-muted);
      }

      .facts__val {
        font-weight: 600;
      }

      .note {
        font-size: var(--text-sm);
        color: var(--ink-faint);
        padding: 0.35rem 0 0;
      }

      /* A module switched off leaves nothing to draw. */
      .empty {
        font-size: var(--text-md);
        color: var(--ink-faint);
        padding: 0.5rem 0;
      }

      /* Motion is decorative here — the panel is equally usable without it. */
      @media (prefers-reduced-motion: reduce) {
        .panel,
        .body,
        .card,
        .tab,
        .batt__fill,
        .meter__fill {
          transition-duration: 1ms;
          transition-delay: 0ms;
        }

        .card,
        .body {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="panel" id="panel" aria-label="Notch heads-up display">
      <h1 class="visually-hidden">notch</h1>

      <!-- The menu-bar row: content on both sides of the physical notch. -->
      <div class="strip" id="strip">
        <div class="strip__inner">
          <div class="strip__slot">
            <span class="strip__clock" id="pill-clock">—</span>
            <span class="strip__meridiem" id="pill-meridiem"></span>
          </div>
          <div class="strip__gap"></div>
          <div class="strip__slot strip__slot--right">
            <span class="micro" id="pill-day">
              <i class="micro__seg"></i>
              <i class="micro__seg"></i>
              <i class="micro__seg"></i>
            </span>
            <span id="pill-batt"></span>
          </div>
        </div>
      </div>

      <!-- Everything below only exists once the window has grown. -->
      <div class="body">
        <!-- Dynamic-island style: rest on a pill to page through detail without
             leaving the notch or opening a window. -->
        <div class="tabs" id="tabs" role="tablist" aria-label="Views">
          <button
            class="tab tab--on"
            data-tab="overview"
            type="button"
            role="tab"
            aria-selected="true"
          >
            Overview
          </button>
          <button class="tab" data-tab="day" type="button" role="tab" aria-selected="false">
            Day
          </button>
        </div>

        <div class="view view--on" id="view-overview" role="tabpanel" aria-label="Overview">
          <div class="cards">
            <div class="card" id="card-clock">
              <h2 class="card__title">Now</h2>
              <div class="card__row">
                <span class="clock">
                  <span id="d-clock">—</span><span class="clock__meridiem" id="d-meridiem"></span>
                </span>
                <span class="batt" id="d-batt" hidden>
                  <span class="batt__shell"><span class="batt__fill" id="d-batt-fill"></span></span>
                  <span id="d-batt-pct"></span>
                </span>
              </div>
              <div class="meter">
                <div class="meter__top">
                  <b class="meter__label" id="d-date"></b>
                  <span class="meter__value" id="d-remaining"></span>
                </div>
                <div
                  class="meter__track"
                  role="progressbar"
                  aria-label="Day elapsed"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  id="d-day-track"
                >
                  <span class="meter__fill" id="d-day-fill"></span>
                </div>
              </div>
            </div>

            <div class="card" id="card-week">
              <h2 class="card__title">This week</h2>
              <div class="card__row">
                <span class="clock" id="d-week-pct">—</span>
              </div>
              <div class="meter">
                <div class="meter__top">
                  <b class="meter__label">Monday to Sunday</b>
                </div>
                <div
                  class="meter__track"
                  role="progressbar"
                  aria-label="Week elapsed"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  id="d-week-track"
                >
                  <span class="meter__fill meter__fill--accent" id="d-week-fill"></span>
                </div>
              </div>
              <p class="note" id="d-week-note"></p>
            </div>
          </div>
        </div>

        <div class="view" id="view-day" role="tabpanel" aria-label="Day">
          <div class="card">
            <h2 class="card__title">Day</h2>
            <dl class="facts" id="day-facts"></dl>
          </div>
        </div>
      </div>
    </section>

    <script src="notch.js" defer></script>
  </body>
</html>
