[workspace]
resolver = "2"
members = ["crates/notch-core", "crates/notch", "crates/notch-app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# rustls rather than the system TLS, so a build needs no OpenSSL on the box.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
  "json",
] }
walkdir = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
